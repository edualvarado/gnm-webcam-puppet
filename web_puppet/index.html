<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GNM Head — M1 viewer</title>
    <style>
      :root {
        /* Brand palette. Teal leads, navy carries surfaces, plum accents. */
        --teal: #2f8871;
        --teal-bright: #54c4a7;
        --navy: #283477;
        --plum: #612e65;
        --plum-bright: #9b3ca1;

        --bg: #070a18;
        --panel: rgba(21, 27, 63, 0.72);
        --edge: rgba(47, 136, 113, 0.28);
        --text: #cfe8de;
        --dim: #7d93a4;
        --accent: var(--teal-bright);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        overflow: hidden;
      }

      #app { display: flex; height: 100%; }

      #stage { position: relative; flex: 1; min-width: 0; }
      #view { display: block; width: 100%; height: 100%; }

      #hud {
        position: absolute;
        left: 20px;
        bottom: 18px;
        pointer-events: none;
        color: var(--dim);
        letter-spacing: 0.04em;
      }
      #hud strong {
        display: block;
        color: var(--text);
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        margin-bottom: 4px;
      }
      #cost { color: var(--accent); }
      #verify { color: var(--plum-bright); }

      /* Floating tracker view. Sits over the render rather than beside it, so
         the head keeps the full stage and the two read as one scene. */
      #pipWrap {
        position: absolute;
        right: 22px;
        bottom: 22px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        pointer-events: none;
      }
      #pip {
        display: block;
        border-radius: 50%;
        border: 1px solid rgba(47, 136, 113, 0.35);
        /* Invisible until the camera starts, so an empty circle never sits
           on the render. */
        opacity: 0;
        transition: opacity 0.35s ease, box-shadow 0.35s ease;
      }
      #pip.live {
        opacity: 1;
        box-shadow:
          0 0 0 1px rgba(84, 196, 167, 0.45),
          0 0 26px rgba(84, 196, 167, 0.22);
      }
      #pipStatus {
        color: var(--dim);
        font-size: 10px;
        letter-spacing: 0.04em;
        text-align: center;
      }

      #panel {
        width: 320px;
        flex: none;
        padding: 22px 20px 40px;
        overflow-y: auto;
        background: var(--panel);
        border-left: 1px solid var(--edge);
        backdrop-filter: blur(12px);
      }

      #panel h2 {
        margin: 22px 0 10px;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
        opacity: 0.85;
      }
      #panel h2:first-child { margin-top: 0; }

      .group { display: flex; flex-direction: column; gap: 6px; }

      .row {
        display: grid;
        grid-template-columns: 108px 1fr 38px;
        align-items: center;
        gap: 8px;
      }
      .name {
        color: var(--dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 11px;
      }
      .value { color: var(--text); text-align: right; font-size: 11px; }

      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 2px;
        background: rgba(47, 136, 113, 0.32);
        border-radius: 2px;
        outline: none;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
        box-shadow: 0 0 8px rgba(84, 196, 167, 0.7);
      }
      input[type="range"]::-moz-range-thumb {
        width: 11px;
        height: 11px;
        border: none;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
      }

      .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
      button {
        flex: 1 1 auto;
        padding: 8px 10px;
        font: inherit;
        font-size: 11px;
        color: var(--text);
        background: transparent;
        border: 1px solid var(--edge);
        border-radius: 4px;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }
      /* Plum earns its place in the UI on interaction, mirroring its role in
         the render as the accent that only appears on a turning edge. */
      button:hover {
        background: rgba(155, 60, 161, 0.14);
        border-color: rgba(155, 60, 161, 0.55);
        color: #f0d8f2;
      }

      @media (max-width: 720px) {
        #app { flex-direction: column; }
        #panel { width: 100%; border-left: none; border-top: 1px solid var(--edge); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <canvas id="view"></canvas>
        <div id="pipWrap">
          <canvas id="pip"></canvas>
          <div id="pipStatus"></div>
        </div>
        <div id="hud">
          <strong>GNM Head</strong>
          <div id="status">Loading…</div>
          <div id="cost"></div>
          <div id="verify"></div>
        </div>
      </div>
      <aside id="panel"></aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
